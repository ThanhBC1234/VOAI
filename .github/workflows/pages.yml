name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-notebooks.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install Node.js dependencies from lockfile
        run: npm ci

      - name: Install notebook runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-notebooks.txt

      - name: Lint TypeScript and React
        run: npm run lint

      - name: Type-check without emitting files
        run: npm exec tsc -- --noEmit

      - name: Build and run rendered website tests
        run: npm test

      - name: Validate notebook structure
        run: python scripts/validate_notebooks.py

      - name: Run local grader tests
        run: python -m unittest grader/tests/test_grader.py -v

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Build the static GitHub Pages site
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Validate the GitHub Pages artifact
        run: node --test tests/pages-export.test.mjs

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
