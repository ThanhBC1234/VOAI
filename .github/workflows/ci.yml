name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify code, content, notebooks, and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-notebooks.txt

      - name: Install Node.js dependencies from lockfile
        run: npm ci

      - name: Install notebook runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-notebooks.txt

      - name: Lint TypeScript and React
        run: npm run lint

      - name: Type-check without emitting files
        run: npm exec tsc -- --noEmit

      - name: Build and run rendered website tests
        run: npm test

      - name: Validate notebook structure
        run: python scripts/validate_notebooks.py

      - name: Run local grader tests
        run: python -m unittest grader/tests/test_grader.py -v

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Build the GitHub Pages artifact
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/voai-lab
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Validate the GitHub Pages artifact
        run: node --test tests/pages-export.test.mjs
